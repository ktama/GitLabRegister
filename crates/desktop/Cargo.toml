[package]
name = "gitlabregister-desktop"
version.workspace = true
edition.workspace = true
# Tauri 2.12 が要求する下限。コア層とインフラ層の下限 (1.82) は上げない。
rust-version = "1.90"
description = "GitLabRegister の Tauri 外殻と画面 (設計書 4.2 UI 層)"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gitlabregister-app = { workspace = true }
gitlabregister-core = { workspace = true }
gitlabregister-infra = { workspace = true }
tauri = { workspace = true }
# 取り込みと書き出しのファイルを OS 標準の選択画面で選ぶ (FR-18、FR-22)。
tauri-plugin-dialog = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
# 配布用のビルドで指定する。画面 (ui/) を exe に埋め込み、開発サーバーを参照しない。
# tauri-cli を使わずに `cargo build --release --features custom-protocol` で配布物を作るために置く。
custom-protocol = ["tauri/custom-protocol"]
