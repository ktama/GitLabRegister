description = "GitLabRegister の Tauri 外殻と画面 (設計書 4.2 UI 層)"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gitlabregister-app = { workspace = true }
gitlabregister-core = { workspace = true }
gitlabregister-infra = { workspace = true }
tauri = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
